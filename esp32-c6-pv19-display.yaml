substitutions:
  device_name: "MUST_PH19"
  name: "must-ph19"
  device_location: "Tech Room"
  device_description: "Monitor MUST inverter via RS485 on ESP32-C6"
  tx_pin: GPIO1
  rx_pin: GPIO2
  update_interval: 120s

esphome:
  name: ${name}
  min_version: 2024.11.0
  comment: ${device_location}

# external_components:
#   - source: github://pr#8032
#     components: [ modbus, uart, modbus_controller ]

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.33
    subnet: 255.255.255.0
    gateway: 192.168.1.1
  ap:
    ssid: ${device_name}
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password
  platform: esphome

web_server:
  port: 80
  version: 3

switch:
  - platform: restart
    name: "${device_name} restart"

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO6
  interface: hardware

logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8
  rx_buffer_size: 4096
  debug:
    direction: BOTH
    after:
      timeout: 100ms
    sequence:
      - lambda: |-
          if (direction == UART_DIRECTION_TX) {
            id(flash_tx).execute();
          } else {
            id(flash_rx).execute();
          }

modbus:
  id: mod_bus_must
  send_wait_time: 1000ms

modbus_controller:
  - id: must
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: 30s
    command_throttle: 500ms

color:
  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
  - id: color_red
    red: 100%
    green: 0%
    blue: 0%
  - id: color_green
    red: 0%
    green: 100%
    blue: 0%
  - id: color_blue
    red: 0%
    green: 50%
    blue: 100%
  - id: color_yellow
    red: 100%
    green: 100%
    blue: 0%

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_large
    size: 36
    bpp: 4

display:
  - platform: st7789v
    model: Waveshare 1.47in 172X320
    cs_pin: GPIO14
    dc_pin: GPIO15
    reset_pin: GPIO21
    rotation: 270
    update_interval: 200ms
    <<: !include display_logic.yaml

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip

globals:
  - id: uart_tx_active
    type: bool
    initial_value: 'false'
  - id: uart_rx_active
    type: bool
    initial_value: 'false'

script:
  - id: flash_tx
    mode: restart
    then:
      - lambda: 'id(uart_tx_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_tx_active) = false;'
  - id: flash_rx
    mode: restart
    then:
      - lambda: 'id(uart_rx_active) = true;'
      - delay: 150ms
      - lambda: 'id(uart_rx_active) = false;'

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000Hz

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    rgb_order: RGB
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    name: "Onboard LED"


  - platform: monochromatic
    name: "${device_name} Backlight"
    output: backlight_pwm
    id: lcd_backlight
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  # CE: - Charger Errors from 15213 (id:charger_error_message))
  - platform: template
    name: "CE: Charger hardware protection"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 0) & 1);

  - platform: template
    name: "CE: Over current"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 1) & 1);

  - platform: template
    name: "CE: Current sensor error"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 2) & 1);

  - platform: template
    name: "CE: Over temperature"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 3) & 1);

  - platform: template
    name: "CE: PV voltage is too high"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 4) & 1);

  - platform: template
    name: "CE: PV voltage is too low"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 5) & 1);

  - platform: template
    name: "CE: Battery voltage is too high"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 6) & 1);

  - platform: template
    name: "CE: Battery voltage is too low"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 7) & 1);

  - platform: template
    name: "CE: Current is uncontrollable"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 8) & 1);

  - platform: template
    name: "CE: Parameter error"
    lambda: return (bool)(( (uint16_t)id(charger_error_message).state >> 9) & 1);

  # CW: - Charger Warnings from 15214 (id:charger_warning_message))
  - platform: template
    name: "CW: Fan error"
    lambda: return (bool)(( (uint16_t)id(charger_warning_message).state >> 0) & 1);

