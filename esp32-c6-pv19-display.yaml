sensor:
  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    id: wifi_rssi
    update_interval: 60s

  - platform: modbus_controller
    address: 10111
    id: batt_capacity
    name: "Battery Capacity"
    unit_of_measurement: "Ah"
    register_type: holding

  - platform: modbus_controller
    address: 113
    id: soc
    name: "State of Charge"
    unit_of_measurement: "%"
    register_type: holding
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            ESP_LOGD("custom", "SOC Value for LED: %.1f", x);
            auto call = id(onboard_led).turn_on();
            if (x < 20) {
              call.set_rgb(1.0, 0.0, 0.0);
            } else if (x < 50) {
              call.set_rgb(1.0, 1.0, 0.0);
            } else {
              call.set_rgb(0.0, 1.0, 0.0);
            }
            call.perform();

  - platform: modbus_controller
    address: 15201
    name: "Charger workstate"
    register_type: holding
    icon: mdi:battery-charging-50

  - platform: modbus_controller
    address: 15202
    name: "MPPT state"
    register_type: holding

  - platform: modbus_controller
    address: 15203
    name: "Charging state"
    register_type: holding

  - platform: modbus_controller
    id: inverter_error_message_1
    address: 25261
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_error_message_2
    address: 25262
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: inverter_warning_message_1
    address: 25265
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: charger_error_message
    address: 15213
    register_type: holding
    internal: true

  - platform: modbus_controller
    id: charger_warning_message
    address: 15214
    register_type: holding
    internal: true

  - platform: modbus_controller
    address: 15205
    name: "PV1 voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 16205
    name: "PV2 voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15206
    name: "Battery voltage (charger side)"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15207
    name: "PV1 Charger Current"
    register_type: holding
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 16207
    name: "PV2 Charger Current"
    register_type: holding
    unit_of_measurement: "A"
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 15208
    register_type: holding
    id: pv1_power
    name: "PV1 Charger power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 16208
    register_type: holding
    id: pv2_power
    name: "PV2 Charger power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    icon: mdi:flash

  - platform: modbus_controller
    address: 15211
    register_type: holding
    name: "Battery Relay"
  - platform: modbus_controller
    address: 15212
    register_type: holding
    name: "PV Relay"
    icon: mdi:electric-switch

  - platform: modbus_controller
    address: 15217
    register_type: holding
    id: charger_total_mwh
    internal: true

  - platform: modbus_controller
    address: 15218
    register_type: holding
    id: charger_total_kwh
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Accumulated charger power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    lambda: |-
     return (id(charger_total_mwh).state * 1000.0 + id(charger_total_kwh).state );
    accuracy_decimals: 1

  - platform: modbus_controller
    address: 25201
    id: inverter_work_state
    register_type: holding
    name: "Inverter Work state"

  - platform: modbus_controller
    address: 25205
    id: batt_voltage
    name: "Battery voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    address: 25206
    name: "Inverter voltage"
    register_type: holding
    unit_of_measurement: "V"
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
